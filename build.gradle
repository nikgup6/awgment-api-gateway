plugins {
    id 'org.springframework.boot' version '2.3.12.RELEASE'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'com.google.cloud.tools.jib' version '3.0.0'
    id 'jacoco'
    id 'java'

}

group = 'com.techsophy.tsf'
version = '1.2.0'
description = 'tp-api-gateway'

compileJava {
    sourceCompatibility = 11
    targetCompatibility = 11
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "Hoxton.SR12")
    set('spring-framework.version', '5.2.25.RELEASE')
    set('spring-security.version', '5.3.13.RELEASE')
    set('netty.version', '4.1.140.Final')
    set('jackson-bom.version', '2.18.12')
    set('logback.version', '1.2.13')
    set('snakeyaml.version', '1.33')
}
jib {
	container {
		jvmFlags = [
				'-Dotel.exporter=jaeger',
				'-Dotel.exporter.jaeger.endpoint=http://jaeger:14250',
				'-Dotel.exporter.jaeger.service.name=gateway',
				'-Dapplication.name=gateway',
				'-javaagent:/opentelemetry-javaagent-all.jar'
		]
	}
}

dependencies {
    implementation 'com.techsophy:id-generator:2.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-security'
    implementation 'org.springdoc:springdoc-openapi-webflux-ui:1.5.9'
    implementation 'org.springframework.cloud:spring-cloud-starter-config:3.1.2'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap:3.1.2'
    runtimeOnly 'org.springframework.cloud:spring-cloud-dependencies:2020.0.3'
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation 'org.keycloak:keycloak-admin-client:26.0.8'

    compileOnly 'org.projectlombok:lombok:1.18.20'
    annotationProcessor 'org.projectlombok:lombok:1.18.20'
    testImplementation  'io.rest-assured:json-path:4.2.1'
    testImplementation 'io.rest-assured:xml-path:4.2.1'

    testCompileOnly 'org.projectlombok:lombok:1.18.20'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.20'
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation group: 'io.rest-assured', name: 'rest-assured', version:'4.2.1'
    testImplementation 'io.projectreactor:reactor-test'
    // Keycloak 26 client classes are final
    testImplementation 'org.mockito:mockito-inline'
}



dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springframework.security:spring-security-bom:5.3.13.RELEASE"
        mavenBom "io.netty:netty-bom:4.1.140.Final"
    }
    dependencies {
        dependency 'com.google.guava:guava:33.8.0-jre'
        dependency 'commons-io:commons-io:2.22.0'
        dependency 'com.nimbusds:nimbus-jose-jwt:9.48'
        dependency 'net.minidev:json-smart:2.6.1'
    }
}

jar{
    enabled = false
}
test {
    finalizedBy jacocoTestReport
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled true
        html.enabled true
    }
}


jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }

    }
}
check.dependsOn jacocoTestCoverageVerification


//Integration test configuration
sourceSets{
    integrationTest {
        java{
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integrationTest/java')
            srcDir file('src/integrationTest/resources')

        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}


tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    outputs.upToDateWhen { false }
}
check.dependsOn compileIntegrationTestJava